name: Fork Image

# Minimal build-and-push for the sjfehlen fork, deployed on bender via Arcane.
# Upstream's docker-image.yml (signing, Docker Hub, release gating) is not used.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/sjfehlen/ovumcy-web:main
            ghcr.io/sjfehlen/ovumcy-web:sha-${{ github.sha }}
